        <!-- Ouvrir une nouvelle fenêtre vers le fichier -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Fichier Dump-text
                const frDump = document.getElementById('frDump');
                const frDumpLink = "PALS/dumps-text-fr.txt"; 
                const zhDump = document.getElementById('zhDump');
                const zhDumpLink = "PALS/dumps-text-zh.txt";

                // Fichier Contextes
                const frCtxt = document.getElementById('frCtxt');
                const frCtxtLink = "PALS/contextes-fr.txt";
                const zhCtxt = document.getElementById('zhCtxt');
                const zhCtxtLink = "PALS/contextes-zh.txt";

                frDump.addEventListener('click', () => {
                    // Ouvre une nouvelle fenêtre ou onglet
                    window.open(frDumpLink, "_blank", "width=600,height=400,resizable=yes");
                });

                zhDump.addEventListener('click', () => {
                    // Ouvre une nouvelle fenêtre ou onglet
                    window.open(zhDumpLink, "_blank", "width=600,height=400,resizable=yes");
                });

                frCtxt.addEventListener('click', () => {
                    // Ouvre une nouvelle fenêtre ou onglet
                    window.open(frCtxtLink, "_blank", "width=600,height=400,resizable=yes");
                });

                zhCtxt.addEventListener('click', () => {
                    // Ouvre une nouvelle fenêtre ou onglet
                    window.open(zhCtxtLink, "_blank", "width=600,height=400,resizable=yes");
                });
            });
        </script>
