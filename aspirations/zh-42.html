<link href="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="https://rs2.huanqiucdn.cn/huanqiu/image/www/common/200.jpg" style="display:none;"><div id="config_page" style="display:none;">/csr-component/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="visibility:hidden;height:0; overflow:hidden;"><div id="csr_topheader_ad">7003383</div><div id="csr_bottomheaderl_ad">7005136</div><div id="csr_bottomheaderr_ad">7005137</div><!--<cs-control data-src="controls/csr_article_ad/csr_article_ad"></cs-control>--><article><textarea class="article-aid">41zXgqRRe9M</textarea><textarea class="article-author">作者：郑鑫</textarea><textarea class="article-host">women.huanqiu.com</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">《褒衣洒脱博带宽》：当窗理云鬓 对镜帖花黄</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-catnode">/e5annnavo/e5at2gq3u</textarea><textarea class="article-content"><article><section data-type="rtext"><p>春节娶媳妇过年，春节穿新衣戴新帽，欢欢喜喜过大年，这是几千年中国人的心之向往，更是一种根植于文化的传统礼俗。 </p><p>一首《木兰辞》展示了古代女子浴血沙场的英姿，巾帼不让须眉。战争结束回归故里，代父从军的花木兰脱下战时袍，恢复女儿身，梳妆打扮，尽显小女子的姿态。“阿姊闻妹来，当户理红妆”“当窗理云鬓，对镜帖花黄。”《木兰辞》中的“红妆”“额黄妆”，其实是在佛教艺术影响下诞生的一种古代妇女妆饰，产生于南北朝时期，反映了特定的时代背景和人文风貌。笔者新著《褒衣洒脱博带宽——六朝人的衣柜》，就是一本关于魏晋南北朝时期，尤其是六朝春节婚俗的妆容与服饰时尚的解读。</p><p><i class="pic-con"><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/ffa09d3d8229d6ba2de8e0ffb7ddf620.jpg?imageView2/2/w/1260" /></i></p><p>《褒衣洒脱博带宽——六朝人的衣柜》 黄强 著 商务印书馆</p><p><em data-scene="strong">一.婚嫁新娘用红妆</em></p><p>红妆即红粉妆，以胭脂、红粉涂抹脸部。红妆在秦汉时期已经出现，魏晋南北朝时得以发挥，颇为流行，这一时期的诗歌有红妆的反映。南朝齐谢朓《赠王主簿》云：“日落窗中坐，红妆好颜色”，女性着红妆也符合其性别身份，更能展现出女性的妖娆。</p><p>红妆是南北朝时期女子出阁成婚的常用妆容。对于红色的崇尚，由来已久，按照五行学说，朝代更替，也要正朔色。以木为德，其色崇青；以土为德，其色尚黄；以金为德，其色崇白；以火为德，其色尚红；以水为德，其色崇黑。红色在周代、汉代都受到推崇，周代官员喜欢穿着红玉一般色彩的细毛袍子；汉高祖刘邦号称赤帝子，汉代尚红。南北朝时期尚未形成明代以降的红色婚服制度，但是因为红色有红火的寓意，加上胭脂在此时已由北方传入中原，因此，红妆在女子中流行，婚礼中新娘妆容亦倾向于红妆。梁简文帝《美人晨妆》亦云：“娇羞不肯出，犹言妆未成。青黛随眉广，燕脂逐脸生。”施了胭脂红妆的女性更加妩媚动人。</p><p>除了红妆外，魏晋南北朝时期妆饰还有酒晕妆、桃花妆、飞霞妆、晓霞妆、面靥妆、半面妆、斜红妆、啼妆、紫妆、点妆等多种，造型上颇为夸张。</p><p><em data-scene="strong">二.女性扮美帖额黄</em></p><p>新娘是女人一生最美的时刻。爱美的女性，尤其是出阁的新娘，对于梳妆打扮那是刻意追求。南北朝时期的女子除了两颊的妆容，还有额头的妆饰。《木兰辞》中“当窗理云鬓，对镜帖花黄”，前者说发型，后者说额妆。</p><p>受佛教艺术影响，此时的女性流行在额头涂黄、贴黄，黏贴在额上的薄片又称花黄。梁代江洪《咏歌姬》云：“薄鬓约微黄，轻红澹铅脸。”梁代简文帝萧纲的后宫嫔妃盛行作额黄妆，简文帝每天所见，印象深刻，因此在他的诗歌中屡有反映，《美女篇》云：“约黄能效月，裁金巧作星。”《戏赠丽人》云：“同安鬟里拔，异作额间黄。”这些薄片除了染成金黄，也有染成霁红或翠绿等色剪作花、鸟、鱼等形，粘贴于额头、酒靥、嘴角、鬓边等处，成为面饰的一种，因贴的部位不同，形状色泽不同，又称为花胜、罗胜、翠钿、金钿等名称。</p><p><i class="pic-con"><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/ee9cded5ba996d3cfc5ae2d5a21a7fe7.jpg?imageView2/2/w/1260" /></i></p><p>晋朝妇女穿红色广袖短襦，绿色长裙。（晋）顾恺之《女史箴图》（局部）</p><p>对于“花黄”，有的观点倾向于就是额黄妆，有的则持否定的观点，认为贴花黄已脱离了额黄的范畴，更多地接近花钿的妆饰。前面已经说明额黄妆有两种，一是染色，二是贴黄，后者与花钿有近似，但是贴的是染黄的薄片，仍然属于额黄妆的范畴，至于花钿所贴饰品色彩较之花黄更丰富。花钿是古时妇女脸上的一种花饰，又称花子、花钿。有观点认为梅花妆即是花钿，不准确。我在拙著《褒衣洒脱博带宽——六朝人的衣柜》中有论述：寿阳公主的梅花妆确有与花钿相似之处，即在额上画出花瓣妆或用花瓣饰品贴在额上。但是花钿使用金属材质后，花钿分为两种：无脚花钿与有脚花钿。前者与梅花妆接近，以薄片饰品贴额上。后者则是花钿金属材质，连接上短柄，插到发髻上，成为发簪。</p><p>考古发现，两晋时期已经出现薄片饰品与连短柄的这两种花钿，江苏南京北郊、郭家山、幕府山、中华门外南山顶等多处晋墓出土了金质花钿实物，薄片花瓣形花钿与有短柄的鸡心形花钿都有。梁朝庾肩吾《冬晓诗》：“萦鬟起照镜，谁忍插花钿。”注意诗中说的是“插花钿”，而不是贴花钿，也不是“对镜贴花黄”的行为。南朝徐陵《玉台新咏·序》也有“反插金钿”之语。</p><p><em data-scene="strong">三.高髻彰显个性</em></p><p>以东吴、东晋、南朝为朝代概念的六朝时期思想开放，个性彰显，给女性提供了追求美丽，展示美感，创造美事的空间。此时的妇女发式，呈现出多种多样，花样百出，争奇斗艳，各领风骚的状态。发式有反绾髻、百花髻、芙蓉归云髻、凌云髻、随云髻、盘恒髻等。缬子髻形制为编发为环，以色带束之。盘恒髻，形制为梳挽时将发掠至头顶，合为一束，盘旋成髻，远望如层层叠云。飞天髻形制为梳挽时将发掠至头顶，分成数股，每股弯成圆环，直耸于上。</p><p>东晋顾恺之《洛神赋图》中描绘了灵蛇髻。梳理时将发掠至头顶，编成一股、双股或多股，然后盘成各种环形。因为发式扭转自如，如同游蛇蜿蜒、灵动，故名。传说灵蛇髻为魏文帝皇后甄氏创制。《采兰杂志》记载：“甄后入既魏宫，宫廷有一绿蛇。……每日后梳妆，则盘结一髻于后前。后异之，因效而为髻，巧夺天工。故后髻每日不同，号为灵蛇髻。宫人拟之，十不得其一二。”</p><p>自两晋以来，南方妇女的发式就渐趋高大，社会时尚，尤其是女性以高发髻为美。《晋书·五行志》记载：“太元中，公主妇女必缓鬓倾髻，以为盛饰。用发既多，不可恒戴，乃先于木及笼上装之，名曰假髻。至于贫家，不能自办，自号无头，就人借头。”妇女头发梳理的发髻，仍然达不到社会时尚推崇的高耸发髻，女性就借助木笼，做成高大的假发髻。这种假发、假髻、借头相当于今天戏剧中的“假头套”，但是比假头套要高大。庾信《春赋》有云：“钗朵多而讶重，髻鬟高而畏风。”高大的发髻在头顶上形成一个巨大的盘结，高耸，造型奇特，可以衬托出身材的修长，有强烈的视觉效果。</p><p><i class="pic-con"><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/457fb30980b60a7d32c087c0c90491fd.jpg?imageView2/2/w/1260" /></i></p><p>晋朝妇女穿红色广袖短襦，绿色长裙。（晋）顾恺之《女史箴图》（局部）</p><p><em data-scene="strong">四.褒衣博带成时尚</em></p><p>从魏晋到南北朝时期，中国的服饰主要有两种形式：一是汉族服式，即承袭秦汉旧制；二是少数民族服饰，承袭北方习俗。</p><p>当时，衫是汉族男子的主要服饰。衫和袍在样式上具有十分明显的区别：按照汉代的习俗，凡是称为袍的，袖口应收敛，且装有祛口；而衫却不需要祛口，袖口非常宽敞。由于衫基本不受约束，因此魏晋时期的服装日趋宽博，这也成了当时的风俗，并对南北朝服饰产生了巨大影响，无论是王公贵族、文人雅士还是平民百姓，都以褒衣博带、宽衫大袖为尚。《洛阳迦蓝记》云：“羽仪服式，悉如魏法。江表士庶，竞相模楷，褒衣博带，被及秣陵。”文人雅士最喜欢穿衫，宽大的衫子成为当时最具个性化的服饰，以嵇康、阮籍为代表的竹林七贤就好穿宽大的衫子。竹林七贤基本上都做过官，但是他们“越名教而任自然”，放弃官职，甘于做山野之人，抚琴长啸，寄情山林。他们穿的服饰不是官服，而是百姓的服饰，宽大的衫子，飘逸的风度，是他们蔑视权贵，鄙视世俗，纵情山水，精神奔放的最好写照。</p><p>从东晋一直到南朝各代，服装主要的发展方向是趋向宽松肥大。《晋书·五行志》云：“晋末皆冠小而衣裳博大，风流相仿，舆台成俗。”其原因无外乎士大夫生活安逸，纵情放达，追求飘逸的感觉，“褒衣博带”正好体现出飘逸之感。直到梁代，士大夫还喜欢穿肥大的衣服，系着宽松的长带，头戴高帽，足蹬高齿木屐，仪态潇洒从容。</p><p><em data-scene="strong">五.女性服饰上俭下丰</em></p><p>六朝时期的女性一般上身穿衫、襦，下身穿裙子，款式多上俭下丰，裙子曳地，下摆宽松，以达到俊俏潇洒的美学效果。</p><p>贵族妇女的服装虽然还有长裙曳地、宽衣广袖，但是已经渐渐减少，代之以交领长裙或上衣下裙分装。裙外腰间加有带若干飘带的斜角形、三角形围腰。此时的襦衫以瘦小紧身为尚，衣袖宽窄不一。裙长盖于脚面。裙是以上俭下丰的斜片布料拼合而成，裙摆较为宽大。在江苏南京石子岗、幕府山等地出土的六朝侍女陶俑中，可以看到这种服饰的风格。</p><p>六朝时期的婚服体现“上俭下丰”即上窄下宽的风格，沈从文先生考证面料则选用白色薄质丝绸制作。注意，并不是后来的红色婚服。上衣以衫子为主，外罩短襦，下裳为裙。衫有单层与夹层之分，沈约《少年新婚中咏》诗云：“裙开见玉趾，衫薄映凝肤。”说的是单衫，轻薄透明，但是古代婚礼一般不在夏季，集中于冬季的春节等节庆日，新娘内穿薄衫外套短襦，披夹衫等。举办新婚仪式时，新娘要风度不要温度穿薄衫也是常事，今天的婚礼活动中，新娘穿婚纱楚楚“冻（动）”人也是一样。富裕人家，婚礼大厅里也会点上炉火，提高室温。</p><p>六朝人追求服饰之美，创造服饰辉煌，固然有彰显个性，陶醉美感的因素，也有“为悦己者容”的激情与豪迈。六朝男性率性而动，不拘礼节，六朝女性何尝不是敢作敢为敢爱的主？婚礼中的女性更是扮美妆靓，广袖舞翩翩，纤腰更娉婷，薄透时尚美，裙长身姿秀。</p><p>追求美是人的天性，衣冠于人，如金装在佛，其作用不仅在遮身暖体，更具有美化的功能。几乎是从服饰起源的那天起，人们就已将其生活习俗、审美情趣、色彩爱好，以及种种文化心态、宗教观念，都沉淀于服饰之中，构筑成了中华服饰文化精神文明的内涵。精神活跃、思想解放、尊崇个性的六朝，“褒衣博带”风尚，“上俭下丰”风格，“傅粉施朱”妆容，“高耸如云”发式，无一不彰显六朝的社会风情，体现服饰文化格调。六朝之美，美在个性，美在衣尚，美在文化。（黄强）</p></section></article></textarea><textarea class="article-time">1613698932360</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：李晓丹</textarea><textarea class="article-source-name"><a href="http://www.workercn.cn/34059/202102/18/210218111524307.shtml" >光明日报</a></te
